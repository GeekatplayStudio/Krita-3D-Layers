# Runs on every push and pull request: typecheck, Python tests, build, package, and the
# macOS/Linux installer run for real from the release ZIP (Linux).
# The in-Krita integration test (tests/krita) needs Krita and runs locally: npm run test:krita.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: npm ci
      - name: Typecheck the web editor
        run: npm run typecheck
      - name: Python tests
        run: npm test
      - name: Build and package
        run: npm run dist
      - name: Install from the release ZIP (Linux), then uninstall
        run: |
          set -e
          work="$(mktemp -d)"; home="$(mktemp -d)"
          unzip -q dist/Geekatplay-3D-Layers-Krita-*.zip -d "$work"
          HOME="$home" XDG_DATA_HOME= XDG_CONFIG_HOME= sh "$work/Install on Linux.sh"
          test -f "$home/.local/share/krita/pykrita/geekatplay_3d_layers/web/editor.html"
          test -f "$home/.local/share/krita/pykrita/geekatplay_3d_layers.desktop"
          grep -qx "enable_geekatplay_3d_layers=true" "$home/.config/kritarc"
          HOME="$home" XDG_DATA_HOME= XDG_CONFIG_HOME= sh "$work/install/install-unix.sh" --uninstall
          test ! -e "$home/.local/share/krita/pykrita/geekatplay_3d_layers"
          ! grep -q "enable_geekatplay_3d_layers" "$home/.config/kritarc"
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-zip
          path: |
            dist/*.zip
            dist/*.sha256
          retention-days: 14
